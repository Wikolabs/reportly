version: "3.9"

# Reportly demo — production-ready POC.
# 2 services orchestrated:
#   - reportly (Next.js frontend on host port 3013)
#   - reportly-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  reportly-backend:
    image: ghcr.io/wikolabs/reportly-backend:latest
    container_name: reportly-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
networks:
  reportly-net:
    name: reportly-net
    driver: bridge
